version: "3.5"

services:
  # Databases
  mongo:
    container_name: em_mongodb
    image: mongo:latest
    hostname: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: gP_h3cS!Lqu-4
      MONGO_INITDB_DATABASE: em_finance
    volumes:
      - ./databases/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    restart: unless-stopped
    # docker exec -it em_mongodb mongosh -> init-mongo.js

  postgres:
    container_name: em_postgresql
    image: postgres:18.3
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: gP_h3cS!Lqu-4
      POSTGRES_DB: em_postgresql
    volumes:
      - ./databases/postgresql/postgresql-extensions.sql:/docker-entrypoint-initdb.d/postgresql-extensions.sql
      - ./databases/postgresql/init-pg-db.sql:/docker-entrypoint-initdb.d/init-pg-db.sql
      - ./databases/postgresql/init-pg-db-schemas.sql:/docker-entrypoint-initdb.d/init-pg-db-schemas.sql
    restart: unless-stopped

  pgadmin:
    container_name: em_pgadmin
    image: dpage/pgadmin4
    hostname: pgAdmin
    ports:
      - "8777:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: gP_h3cS!Lqu-4
    volumes:
      - ./pgadmin:/root/.pgadmin
    restart: unless-stopped
    depends_on:
      - postgres

  redis:
    container_name: em_redis
    image: 'redis:latest'
    hostname: redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  # Brokers
  zookeeper:
    container_name: em_zookeeper
    image: confluentinc/cp-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always
    ports: [ '2181:2181' ]
    volumes:
      - ~/em_zookeeper_data:/var/lib/zookeeper/data
      - ~/em_zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    container_name: em_kafka
    image: confluentinc/cp-enterprise-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports: [ '9092:9092' ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      CONFLUENT_METRICS_REPORTER_ZOOKEEPER_CONNECT: zookeeper:2181
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'true'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    restart: always
    volumes:
      - ~/em_kafka_data:/var/lib/kafka/data

  connect:
    container_name: em_kafka_connect
    image: confluentinc/cp-kafka-connect
    hostname: connect
    depends_on:
      - zookeeper
      - kafka
    ports: [ "8083:8083" ]
    restart: always
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_ZOOKEEPER_CONNECT: "zookeeper:2181"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

  kafka-ui:
    container_name: em_kafka_ui
    image: provectuslabs/kafka-ui
    hostname: kafka-ui
    ports:
      - "9100:8080"
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
    depends_on:
      - kafka
      - connect

volumes:
  em_zookeeper_data:
    driver: local
  em_zookeeper_logs:
    driver: local
  em_kafka_data:
    driver: local